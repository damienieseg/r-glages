function body(id,q){
  const s=secs(id),title=TITLES[id]||"";
  if(!s)return`<h1>${esc(title||"Réglages")}</h1><div class="empty"><b>Section non incluse</b>Cette page n’existe pas dans la démo. Essayez Wi‑Fi, Bluetooth, Notifications, Sons, Affichage ou Batterie.</div>`;
  let out=`<h1>${esc(title)}</h1>`;
  if(id==="root"){
    out+=`<div id="rl">`+rootList(q)+`</div>`;
    return out;
  }
  return out+s.map(secHTML).join("");
}
function secHTML(sc){
  if(sc.raw)return sc.rows.map(row).join("");
  const rows=sc.rows||[],ic=rows.some(r=>r.i);
  return`<div class="sec">${sc.h?`<p class="sh">${esc(sc.h)}</p>`:""}${rows.length?`<div class="grp ${ic?"hasic":""}">${rows.map(row).join("")}</div>`:""}${sc.f?`<p class="sf">${esc(sc.f)}</p>`:""}</div>`;
}
function rootList(q){
  let s=secs("root");q=(q||"").trim().toLowerCase();
  if(q){const rows=s.flatMap(x=>x.rows).filter(r=>r.l&&r.l.toLowerCase().includes(q));
    return rows.length?secHTML({rows}):`<div class="empty"><b>Aucun résultat</b>Aucun réglage ne correspond à « ${esc(q)} ».</div>`;}
  return s.map(secHTML).join("");
}
const SEARCH=`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="Rechercher"  autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>`;
const stack=[],host=document.getElementById("stack"),ph=document.getElementById("phone");
let query="";
function push(id){
  const el=document.createElement("div");el.className="page";
  const prev=stack.length?TITLES[stack[stack.length-1].id]:"";
  el.innerHTML=`<div class="hd">${prev?`<button class="back">${esc(prev)}</button>`:""}<span class="t">${esc(TITLES[id]||"Réglages")}</span></div><div class="bd">${body(id,query)}</div>`;
  const bd=el.querySelector(".bd");if(id==="root"){bd.style.paddingBottom="calc(110px + env(safe-area-inset-bottom,0px))";el.insertAdjacentHTML("beforeend",SEARCH)}bd.addEventListener("scroll",()=>el.classList.toggle("sc",bd.scrollTop>34));
  host.appendChild(el);
  if(stack.length)stack[stack.length-1].el.classList.add("under");
  stack.push({id,el});el.offsetWidth;el.classList.add("in");
}
function pop(){
  if(stack.length<2)return;const {el}=stack.pop();el.classList.remove("in");
  stack[stack.length-1].el.classList.remove("under");setTimeout(()=>el.remove(),380);
}
function refresh(){
  stack.forEach(({id,el})=>{
    if(id==="root"){document.getElementById("rl").innerHTML=rootList(query);return}
    const bd=el.querySelector(".bd"),y=bd.scrollTop;bd.innerHTML=body(id);bd.scrollTop=y;
  });
}
const AV=["linear-gradient(#a0aaff,#3a4690)","linear-gradient(#ffb38a,#d2553b)","linear-gradient(#8fe3b0,#2f8f5b)","linear-gradient(#f4a0d6,#a13a8f)","linear-gradient(#9aa0ad,#5b6070)"];
function apply(){
  ph.style.setProperty("--avbg",AV[S.avc||0]);
  const r=document.documentElement;
  S.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme);
  ph.style.filter=`brightness(${(0.6+S.bright/100*0.4).toFixed(2)})`;
  ph.style.setProperty("--fs",[14,15.5,17,19,22][S.text-1]+"px");
  ph.classList.toggle("bold",!!S.bold);
  const b=document.getElementById("bat");b.classList.toggle("lp",!!S.lp);
  document.getElementById("pct").textContent=S.pct?"87":"";
  document.getElementById("wf").textContent=S.wifi&&S.net?"Wi‑Fi":"";
}
host.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");
  if(t){const k=t.dataset.t;S[k]=S[k]?0:1;
    if(k==="avion"&&S.avion){S.wifi=S.bt=S.cell=0}
    if((k==="wifi"||k==="bt"||k==="cell")&&S[k])S.avion=0;
    t.classList.toggle("on",!!S[k]);apply();setTimeout(refresh,230);return}
  const cy=e.target.closest("[data-cyc]");if(cy){const k=cy.dataset.cyc;S[k]=S[k]?0:1;refresh();return}
  const av=e.target.closest("[data-av]");if(av){S.avc=((S.avc||0)+1)%5;apply();return}
  const g=e.target.closest("[data-go]");if(g){push(g.dataset.go);return}
  const s=e.target.closest("[data-set]");if(s){const[k,v]=s.dataset.set.split("|");S[k]=v;refresh();return}
  const h=e.target.closest("[data-th]");if(h){S.theme=h.dataset.th;apply();refresh();return}
  if(e.target.closest(".back"))pop();
});
host.addEventListener("input",e=>{
  const r=e.target;
  if(r.dataset.sl){const k=r.dataset.sl;S[k]=+r.value;r.style.setProperty("--p",(r.value-r.min)/(r.max-r.min)*100+"%");apply()}
  if(r.dataset.in){S[r.dataset.in]=r.value;if(r.type==="date"){const v=r.parentNode.querySelector(".val");if(v)v.textContent=fmtD(r.value)}save();const rl=document.getElementById("rl");if(rl)rl.innerHTML=rootList(query)}
  if(r.id==="q"){query=r.value;document.getElementById("rl").innerHTML=rootList(query)}
});
function clock(){document.getElementById("clk").textContent=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lt=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lt<350&&!e.target.closest("input"))e.preventDefault();lt=n},{passive:false});
clock();setInterval(clock,30000);apply();push("root");
</script>
</body></html>

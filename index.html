<title>Réglages</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--sub:#8a8a8e;--sep:#d1d1d6;--blue:#007aff;--green:#34c759;--off:#e9e9ea;--frame:#1a1a1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--off:#39393d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--off:#39393d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center;background:#d8d8dd;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#0b0b0c}}
:root[data-theme="dark"] body{background:#0b0b0c}
#phone{--top:47px;--fs:17px;position:relative;width:390px;height:min(844px,100%);border-radius:52px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px var(--frame),0 30px 80px rgba(0,0,0,.35)}
#phone.bold{font-weight:600}
#sb{position:absolute;top:0;left:0;right:0;height:var(--top);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font-weight:600;font-size:16px;pointer-events:none}
#sb .r{display:flex;gap:6px;align-items:center}
.bat{width:25px;height:12px;border:1.5px solid var(--sub);border-radius:4px;position:relative;padding:1px}
.bat i{display:block;height:100%;width:80%;background:var(--tx);border-radius:2px}
.bat.lp i{background:#ffcc00}
#pct{font-size:12px}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}.sig i{width:3px;background:var(--tx);border-radius:1px}
@media (max-width:500px){:root{padding:0}html,body{height:100%}:root body,:root:not([data-theme="light"]) body,:root[data-theme="dark"] body{background:var(--bg)}#phone{--top:env(safe-area-inset-top,0px);width:100%;height:100%;height:100dvh;border-radius:0;box-shadow:none}#sb{display:none}}
.page{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.page.in{transform:none}.page.under{transform:translateX(-28%)}
.hd{position:absolute;top:0;left:0;right:0;height:calc(var(--top) + 44px);padding-top:var(--top);display:flex;align-items:center;justify-content:center;z-index:10;background:transparent;border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.page.sc .hd{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-color:var(--sep)}
.hd .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}.page.sc .hd .t,.page.inl .hd .t{opacity:1}
.back{position:absolute;left:16px;bottom:2px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--card) 65%,transparent);backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);box-shadow:0 2px 12px rgba(0,0,0,.14),inset 0 0 0 .5px rgba(255,255,255,.55);cursor:pointer;padding:0}
.back::before{content:"";width:11px;height:11px;border-left:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:rotate(45deg) scale(.8) translate(2px,-2px);margin:0}
.bd{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--top) + 44px) 16px calc(40px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.bd::-webkit-scrollbar{display:none}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:4px 4px 12px}
.search{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:10px;margin:0;height:54px;padding:0 18px;border-radius:27px;color:var(--sub);background:color-mix(in srgb,var(--card) 62%,transparent);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);box-shadow:0 8px 28px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08),inset 0 0 0 .6px rgba(255,255,255,.6),inset 0 1.5px 2px rgba(255,255,255,.5)}
.search svg{flex:none;width:22px;height:22px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--tx);outline:none;min-width:0}
.search input::placeholder{color:var(--sub)}
.sh,.sf{font-size:13px;color:var(--sub);padding:0 16px;margin:0}
.sh{text-transform:none;margin:22px 0 7px}.sf{margin:7px 0 0;line-height:1.35}
.grp{background:var(--card);border-radius:26px;overflow:hidden;margin-top:0}
.sec+.sec{margin-top:0}
.sec{margin-bottom:24px}.sec:has(.sh){margin-bottom:12px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 20px;font-size:var(--fs);cursor:default;user-select:none}
.row.go,.row.pick,.row.prof{cursor:pointer}.row.go:active,.row.pick:active,.row.prof:active{background:color-mix(in srgb,var(--sub) 20%,transparent)}
.row:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}
.grp.hasic .row:not(:last-child)::after{left:58px}
.ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:17px;margin-left:-4px}
.ic b{font-weight:400;filter:brightness(0) invert(1);font-size:16px;line-height:1}
.lb{flex:1;min-width:0;padding:11px 0}
.val{color:var(--sub);font-size:calc(var(--fs) - 0px)}
i.chev{width:8px;height:8px;border-top:2px solid #c4c4c7;border-right:2px solid #c4c4c7;transform:rotate(45deg);margin-left:-2px;flex:none}
.sw{width:62px;height:34px;border-radius:17px;background:var(--off);position:relative;flex:none;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:40px;height:28px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.8);transition:transform .25s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(16px)}
.ck{color:var(--blue);font-weight:600;font-size:18px}
.prof{padding:12px 16px;gap:14px}
.av{width:60px;height:60px;border-radius:50%;background:var(--avbg,linear-gradient(#a0aaff,#3a4690));color:#fff;display:grid;place-items:center;font-size:23px;font-weight:500;flex:none}
.prof .lb{padding:0}.prof small{display:block;color:var(--sub);font-size:14px;margin-top:2px;line-height:1.25}
.prof strong{font-size:20px;font-weight:500}
.sl{padding:12px 16px;gap:14px}
.sl span{color:var(--sub);flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--blue) var(--p,50%),var(--off) var(--p,50%));outline:none;margin:0;min-width:0}

const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function row(r){

function body(id,q){
  const s=secs(id),title=TITLES[id]||"";
  if(!s)return`<h1>${esc(title||"Réglages")}</h1><div class="empty"><b>Section non incluse</b>Cette page n’existe pas dans la démo. Essayez Wi‑Fi, Bluetooth, Notifications, Sons, Affichage ou Batterie.</div>`;

function secHTML(sc){
  if(sc.raw)return sc.rows.map(row).join("");
  const rows=sc.rows||[],ic=rows.some(r=>r.i);
  return`<div class="sec">${sc.h?`<p class="sh">${esc(sc.h)}</p>`:""}${rows.length?`<div class="grp ${ic?"hasic":""}">${rows.map(row).join("")}</div>`:""}${sc.f?`<p class="sf">${esc(sc.f)}</p>`:""}</div>`;
}
function rootList(q){
  let s=secs("root");q=(q||"").trim().toLowerCase();
  if(q){const rows=s.flatMap(x=>x.rows).filter(r=>r.l&&r.l.toLowerCase().includes(q));
    return rows.length?secHTML({rows}):`<div class="empty"><b>Aucun résultat</b>Aucun réglage ne correspond à « ${esc(q)} ».</div>`;}
  return s.map(secHTML).join("");
}
const SEARCH=`<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="q" type="search" placeholder="Rechercher"  autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>`;
const stack=[],host=document.getElementById("stack"),ph=document.getElementById("phone");
let query="";
function push(id){
  const el=document.createElement("div");el.className="page"+(id==="ident"?" inl":"");
  const prev=stack.length?TITLES[stack[stack.length-1].id]:"";
  el.innerHTML=`<div class="hd">${prev?`<button class="back">${esc(prev)}</button>`:""}<span class="t">${esc(TITLES[id]||"Réglages")}</span></div><div class="bd">${body(id,query)}</div>`;
  const bd=el.querySelector(".bd");if(id==="root"){bd.style.paddingBottom="calc(110px + env(safe-area-inset-bottom,0px))";el.insertAdjacentHTML("beforeend",SEARCH)}bd.addEventListener("scroll",()=>el.classList.toggle("sc",bd.scrollTop>34));

}
function pop(){

}
function refresh(){

}
const AV=["linear-gradient(#a0aaff,#3a4690)","linear-gradient(#ffb38a,#d2553b)","linear-gradient(#8fe3b0,#2f8f5b)","linear-gradient(#f4a0d6,#a13a8f)","linear-gradient(#9aa0ad,#5b6070)"];

host.addEventListener("click",e=>{

host.addEventListener("input",e=>{

});
function clock(){document.getElementById("clk").textContent=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
